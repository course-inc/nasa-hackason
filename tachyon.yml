apiVersion: apps.tachy.one/v1alpha
kind: CloudApps
metadata:
  name: nasa-hackason
  tenantId: tn_01m71hyn06c1mpz8y22ywn8qq3
spec:
  apps:
    - name: hokkaido-analog-finder
      repository:
        url: https://github.com/course-inc/nasa-hackason
        owner: course-inc
        name: nasa-hackason
        defaultBranch: deploy
      rootDirectory: .
      framework: vite
      deploymentTarget: cloudflare_pages
      build:
        # web/src/wasm is committed on this branch (built by `mise run wasm` on main), so no Rust
        # toolchain is needed here. Offline map tiles are downloaded at build time.
        installCommand: npm install -g pnpm@12.16.1 && pnpm --dir web install --frozen-lockfile
        command: node scripts/fetch-walk-tiles.mjs && pnpm --dir web build
        outputDirectory: web/dist
        nodeVersion: "22"
    - name: hackathon-countdown
      repository:
        url: https://github.com/course-inc/nasa-hackason
        owner: course-inc
        name: nasa-hackason
        defaultBranch: deploy
      rootDirectory: .
      framework: static
      deploymentTarget: cloudflare_pages
      build:
        # Single static HTML page (Space Apps Sapporo countdown); nothing to build.
        command: echo "static countdown page"
        outputDirectory: tools/countdown
        nodeVersion: "22"
