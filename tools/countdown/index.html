<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Space Apps 札幌 残り時間</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+JP:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 管制室の秒読み盤: 主役の大きな残り時間 → 次の予定 → 縦タイムライン */
:root{
  --bg:#eef1f6; --panel:#ffffff; --fg:#14192b; --muted:#5d6680; --line:#d3d9e6;
  --accent:#1f4fd8; --warn:#c2410c; --team:#7c3aed; --ok:#0f766e;
  --display:"Chakra Petch","IBM Plex Mono",ui-monospace,monospace;
  --body:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --panel:#121a30; --fg:#e8ecf7; --muted:#8f9ab8; --line:#24304f;
  --accent:#6ea0ff; --warn:#fb923c; --team:#b794f6; --ok:#2dd4bf; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020; --panel:#121a30; --fg:#e8ecf7; --muted:#8f9ab8; --line:#24304f;
  --accent:#6ea0ff; --warn:#fb923c; --team:#b794f6; --ok:#2dd4bf; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:1.05rem;letter-spacing:.08em;margin:0;text-transform:uppercase}
.clock{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.label{font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.big{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;
  font-size:clamp(3rem,15vw,6.2rem);color:var(--accent);display:flex;align-items:baseline;gap:.08em;flex-wrap:wrap}
.big small{font-size:.32em;color:var(--muted);font-weight:500;margin-right:.25em}
.big.urgent{color:var(--warn)}
.sec{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.barlbl{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-family:var(--mono)}
.next{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:4px}
.card .v{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,7vw,2.3rem);font-variant-numeric:tabular-nums;line-height:1.1}
.card .n{font-weight:600}
.card .t{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
@media (max-width:520px){.next{grid-template-columns:1fr}}
.tl-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h2{font-size:.95rem;margin:0}
.toggle{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.day{font-family:var(--display);font-size:.8rem;letter-spacing:.1em;color:var(--muted);margin:10px 0 4px}
ol{list-style:none;margin:0;padding:0;position:relative}
ol::before{content:"";position:absolute;left:58px;top:6px;bottom:6px;width:2px;background:var(--line)}
li{display:grid;grid-template-columns:48px 20px 1fr auto;align-items:center;gap:6px;padding:7px 0;position:relative}
li .time{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
li .dot{width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--muted);justify-self:center;z-index:1}
li .name{min-width:0}
li .rem{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:.68rem;padding:1px 6px;border-radius:999px;border:1px solid currentColor;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.team{color:var(--team)} .tag.key{color:var(--warn)}
li.past{opacity:.45} li.past .dot{background:var(--muted)}
li.key .name{font-weight:600}
li.key .dot{border-color:var(--warn)}
li.team .dot{border-color:var(--team)}
li.next-up{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:8px}
li.next-up .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
li.next-up .rem{color:var(--accent);font-weight:500}
.now-line{display:grid;grid-template-columns:48px 20px 1fr;gap:6px;align-items:center;font-family:var(--mono);font-size:.75rem;color:var(--accent)}
.now-line span:nth-child(2){height:2px;background:var(--accent)}
.hide-team li.team{display:none}
footer{font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .6s}}
</style>
</head><body>

<div class="wrap">
  <header>
    <h1>Space Apps 2026 札幌</h1>
    <div class="clock" id="clock">--:--:-- JST</div>
  </header>

  <section class="hero" aria-live="polite">
    <div class="label" id="heroLabel">札幌提出締切 11/15(日) 14:00 まで</div>
    <div class="big" id="big">--</div>
    <div class="sec" id="heroSub"></div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    <div class="barlbl"><span>11/14 10:00 開始</span><span id="pct">0%</span><span>11/15 14:00 締切</span></div>
  </section>

  <section class="next">
    <div class="card">
      <div class="label">次の予定まで</div>
      <div class="v" id="nextV">--</div>
      <div class="n" id="nextN">--</div>
      <div class="t" id="nextT"></div>
    </div>
    <div class="card">
      <div class="label">チーム目標 13:00 提出完了まで</div>
      <div class="v" id="goalV">--</div>
      <div class="n">発表準備の1時間を確保</div>
      <div class="t">11/15(日) 13:00</div>
    </div>
  </section>

  <section>
    <div class="tl-head">
      <h2>タイムライン</h2>
      <label class="toggle"><input type="checkbox" id="showTeam" checked> チーム目標も表示</label>
    </div>
    <div id="tl"></div>
  </section>

  <footer>時刻はすべて日本時間（JST）。端末の時計をもとに毎秒更新します。</footer>
</div>

<script>
const E=(d,hm,name,kind)=>({at:new Date(`2026-11-${d}T${hm}:00+09:00`),name,kind});
const EVENTS=[
  E(14,"10:00","ハッカソン開始",""),
  E(14,"18:00","会場退館（1日目）",""),
  E(14,"21:00","全道スキャン判定","team"),
  E(15,"02:00","機能凍結","team"),
  E(15,"09:00","コード凍結","team"),
  E(15,"09:30","受付",""),
  E(15,"10:00","2日目開始",""),
  E(15,"13:00","提出完了（チーム目標）","team"),
  E(15,"14:00","札幌提出締切","key"),
  E(15,"14:30","発表・審査",""),
  E(15,"16:30","表彰・Global Nominee発表",""),
  E(15,"18:00","会場退館（2日目）",""),
  E(15,"23:59","世界提出締切",""),
];
const START=EVENTS[0].at, DEADLINE=EVENTS[8].at, GOAL=EVENTS[7].at;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const jst=d=>new Date(d.getTime()+9*3600e3);
const hm=d=>{const j=jst(d);return pad(j.getUTCHours())+":"+pad(j.getUTCMinutes())};
function dur(ms,short){
  if(ms<=0) return "終了";
  const m=Math.floor(ms/60000),h=Math.floor(m/60),mm=m%60;
  if(short) return h?`${h}時間${mm}分`:`${mm}分`;
  return h?`${h}時間${pad(mm)}分`:`${mm}分`;
}
function bigHTML(ms){
  if(ms<=0) return "締切を過ぎました";
  const m=Math.floor(ms/60000),h=Math.floor(m/60),mm=m%60;
  return `${h}<small>時間</small>${pad(mm)}<small>分</small>`;
}
let showTeam=true;
try{const v=localStorage.getItem("showTeam");if(v!==null)showTeam=v==="1"}catch(e){}
$("showTeam").checked=showTeam;
$("showTeam").addEventListener("change",e=>{showTeam=e.target.checked;try{localStorage.setItem("showTeam",showTeam?"1":"0")}catch(_){};render(true)});

let lastMinute=-1;
function render(force){
  const now=new Date(), j=jst(now);
  $("clock").textContent=`${j.getUTCMonth()+1}/${j.getUTCDate()} ${pad(j.getUTCHours())}:${pad(j.getUTCMinutes())}:${pad(j.getUTCSeconds())} JST`;

  const left=DEADLINE-now;
  const big=$("big");
  big.innerHTML=bigHTML(left);
  big.classList.toggle("urgent",left>0&&left<3*3600e3);
  const s=Math.max(0,Math.floor(left/1000)%60);
  $("heroSub").textContent=left>0?`${pad(s)}秒 ・ 合計 ${Math.floor(left/60000).toLocaleString()} 分`:"お疲れさまでした。発表・審査へ。";
  const p=Math.min(1,Math.max(0,(now-START)/(DEADLINE-START)));
  $("barFill").style.width=(p*100).toFixed(1)+"%";
  $("pct").textContent=`経過 ${Math.round(p*100)}%`;

  const vis=EVENTS.filter(e=>showTeam||e.kind!=="team");
  const nxt=vis.find(e=>e.at>now);
  if(nxt){$("nextV").textContent=dur(nxt.at-now,true);$("nextN").textContent=nxt.name;$("nextT").textContent=`${jst(nxt.at).getUTCMonth()+1}/${jst(nxt.at).getUTCDate()} ${hm(nxt.at)}`}
  else{$("nextV").textContent="—";$("nextN").textContent="すべての予定が終了しました";$("nextT").textContent=""}
  $("goalV").textContent=dur(GOAL-now,true);

  const minute=Math.floor(now/60000);
  if(!force&&minute===lastMinute) return;
  lastMinute=minute;
  let html="",curDay=null,nowDrawn=false;
  for(const e of vis){
    const d=jst(e.at).getUTCDate();
    if(d!==curDay){if(curDay!==null)html+="</ol>";html+=`<div class="day">11/${d}（${d===14?"土":"日"}）</div><ol>`;curDay=d}
    if(!nowDrawn&&e.at>now){
      if(e!==vis[0]) html+=`</ol><div class="now-line"><span>${hm(now)}</span><span></span><span>いまここ</span></div><ol>`;
      nowDrawn=true;
    }
    const past=e.at<=now, isNext=e===nxt;
    const cls=[e.kind,past?"past":"",isNext?"next-up":""].join(" ");
    const tag=e.kind==="team"?'<span class="tag team">チーム</span>':e.kind==="key"?'<span class="tag key">実質締切</span>':"";
    html+=`<li class="${cls}"><span class="time">${hm(e.at)}</span><span class="dot"></span><span class="name">${e.name}${tag}</span><span class="rem">${past?"済":"あと "+dur(e.at-now,true)}</span></li>`;
  }
  html+="</ol>";
  $("tl").innerHTML=html;
}
render(true);
setInterval(render,1000);
</script>
</body></html>
