<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Space Apps 札幌 残り時間</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Fira+Sans:wght@600;700&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* 札幌会場サイトの空気（深い青のグラデ・黄色のアクセント・赤い差し色の枠）に合わせた単一テーマ */
:root{
  --deep:#07173f; --blue:#0042a6; --glow:rgba(46,150,245,.45);
  --fg:#ffffff; --muted:#b8c6e6; --line:rgba(120,170,255,.28);
  --panel:rgba(10,40,110,.55); --panel2:rgba(255,255,255,.06);
  --yellow:#e8f53a; --red:#e03c28; --team:#9fd0ff;
  --display:"Fira Sans","Outfit",system-ui,sans-serif;
  --body:"Outfit","Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
html{background:var(--deep)}
body{min-height:100vh;color:var(--fg);font-family:var(--body);line-height:1.6;
  background:radial-gradient(circle at 82% 8%,var(--glow),transparent 540px),linear-gradient(135deg,var(--blue),var(--deep) 72%) fixed,var(--deep);
  overflow-x:hidden}
.orbit{position:fixed;right:-140px;top:60px;width:460px;height:460px;border-radius:50%;
  border:1px solid rgba(120,170,255,.35);box-shadow:0 0 0 40px rgba(46,150,245,.05);pointer-events:none;z-index:0}
.orbit::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--yellow);
  left:-7px;top:50%;box-shadow:0 0 18px var(--yellow)}
.topbar{position:relative;z-index:1;background:var(--deep);border-bottom:1px solid var(--line);
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:880px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:600;font-size:.95rem}
.pill{font-family:var(--body);font-weight:700;font-size:.78rem;letter-spacing:.06em;color:var(--yellow);
  border:1px solid rgba(232,245,58,.45);border-radius:999px;padding:5px 14px;background:rgba(255,255,255,.04);font-variant-numeric:tabular-nums}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}
.eyebrow{align-self:flex-start;font-size:.72rem;font-weight:700;letter-spacing:.14em;color:var(--yellow);
  border:1px solid rgba(232,245,58,.55);background:rgba(232,245,58,.08);padding:2px 10px;border-radius:3px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,5vw,2.45rem);letter-spacing:-.02em;line-height:1.2;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin-top:-10px}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(6px)}
.panel::before{content:"";position:absolute;left:-1px;top:-1px;width:76px;height:4px;background:var(--red)}
.hero{padding:26px 24px;display:flex;flex-direction:column;gap:12px}
.lead{border-left:3px solid var(--yellow);background:var(--panel2);padding:8px 14px;font-weight:600}
.big{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;
  font-size:clamp(3.2rem,15vw,6.6rem);color:var(--fg);display:flex;align-items:baseline;gap:.08em;flex-wrap:wrap}
.big small{font-family:var(--body);font-size:.3em;color:var(--yellow);font-weight:700;margin-right:.3em}
.big.urgent{color:var(--yellow)}
.sec{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#c8f000);width:0}
.barlbl{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.next{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:4px}
.label{font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.card .v{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,7vw,2.4rem);font-variant-numeric:tabular-nums;line-height:1.15}
.card .n{font-weight:700}
.card .t{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:560px){.next{grid-template-columns:1fr}.orbit{width:300px;height:300px;right:-160px}}
.tl{padding:20px 22px}
.tl-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
h2{font-size:1.25rem;margin:0;font-weight:700}
.toggle{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.toggle input{accent-color:var(--yellow)}
.day{font-weight:700;font-size:.85rem;letter-spacing:.08em;color:var(--yellow);margin:14px 0 4px}
ol{list-style:none;margin:0;padding:0;position:relative}
ol::before{content:"";position:absolute;left:58px;top:6px;bottom:6px;width:2px;background:var(--line)}
li{display:grid;grid-template-columns:48px 20px 1fr auto;align-items:center;gap:6px;padding:7px 4px 7px 0;position:relative}
li .time{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
li .dot{width:12px;height:12px;border-radius:50%;background:var(--deep);border:2px solid var(--muted);justify-self:center;z-index:1}
li .name{min-width:0}
li .rem{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid currentColor;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.team{color:var(--team)} .tag.key{color:var(--red);background:rgba(224,60,40,.12)}
li.past{opacity:.42} li.past .dot{background:var(--muted)}
li.key .name{font-weight:700}
li.key .dot{border-color:var(--red)}
li.team .dot{border-color:var(--team)}
li.next-up{background:rgba(232,245,58,.1)}
li.next-up .dot{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 12px var(--yellow)}
li.next-up .rem{color:var(--yellow);font-weight:700}
.now-line{display:grid;grid-template-columns:48px 20px 1fr;gap:6px;align-items:center;font-size:.75rem;font-weight:700;color:var(--yellow)}
.now-line span:nth-child(2){height:2px;background:var(--yellow)}
footer{font-size:.75rem;color:var(--muted)}
input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .6s}}
</style>
</head><body>
<div class="orbit" aria-hidden="true"></div>
<div class="topbar"><div class="topbar-in"><span class="brand">Space Apps Sapporo 2026 ・ 残り時間</span><span class="pill" id="clock">--:--:-- JST</span></div></div>


<div class="wrap">
  <span class="eyebrow">COUNTDOWN</span>
  <h1>札幌提出締切まで、あと</h1>
  <div class="sub">2026年11月14日（土）・15日（日）　時刻はすべて日本時間</div>

  <section class="panel hero" aria-live="polite">
    <div class="lead" id="heroLabel">札幌提出締切 11/15(日) 14:00 まで</div>
    <div class="big" id="big">--</div>
    <div class="sec" id="heroSub"></div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    <div class="barlbl"><span>11/14 10:00 開始</span><span id="pct">0%</span><span>11/15 14:00 締切</span></div>
  </section>

  <section class="next">
    <div class="panel card">
      <div class="label">次の予定まで</div>
      <div class="v" id="nextV">--</div>
      <div class="n" id="nextN">--</div>
      <div class="t" id="nextT"></div>
    </div>
    <div class="panel card">
      <div class="label">チーム目標 13:00 提出完了まで</div>
      <div class="v" id="goalV">--</div>
      <div class="n">発表準備の1時間を確保</div>
      <div class="t">11/15(日) 13:00</div>
    </div>
  </section>

  <section class="panel tl">
    <div class="tl-head">
      <h2>タイムライン</h2>
      <label class="toggle"><input type="checkbox" id="showTeam" checked> チーム目標も表示</label>
    </div>
    <div id="tl"></div>
  </section>

  <footer>チームの非公式ツールです。端末の時計をもとに毎秒更新します。公式情報は札幌会場のサイトを確認してください。</footer>
</div>

<script>
const E=(d,hm,name,kind)=>({at:new Date(`2026-11-${d}T${hm}:00+09:00`),name,kind});
const EVENTS=[
  E(14,"10:00","ハッカソン開始",""),
  E(14,"18:00","会場退館（1日目）",""),
  E(14,"21:00","全道スキャン判定","team"),
  E(15,"02:00","機能凍結","team"),
  E(15,"09:00","コード凍結","team"),
  E(15,"09:30","受付",""),
  E(15,"10:00","2日目開始",""),
  E(15,"13:00","提出完了（チーム目標）","team"),
  E(15,"14:00","札幌提出締切","key"),
  E(15,"14:30","発表・審査",""),
  E(15,"16:30","表彰・Global Nominee発表",""),
  E(15,"18:00","会場退館（2日目）",""),
  E(15,"23:59","世界提出締切",""),
];
const START=EVENTS[0].at, DEADLINE=EVENTS[8].at, GOAL=EVENTS[7].at;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const jst=d=>new Date(d.getTime()+9*3600e3);
const hm=d=>{const j=jst(d);return pad(j.getUTCHours())+":"+pad(j.getUTCMinutes())};
function dur(ms,short){
  if(ms<=0) return "終了";
  const m=Math.floor(ms/60000),h=Math.floor(m/60),mm=m%60;
  if(short) return h?`${h}時間${mm}分`:`${mm}分`;
  return h?`${h}時間${pad(mm)}分`:`${mm}分`;
}
function bigHTML(ms){
  if(ms<=0) return "締切を過ぎました";
  const m=Math.floor(ms/60000),h=Math.floor(m/60),mm=m%60;
  return `${h}<small>時間</small>${pad(mm)}<small>分</small>`;
}
let showTeam=true;
try{const v=localStorage.getItem("showTeam");if(v!==null)showTeam=v==="1"}catch(e){}
$("showTeam").checked=showTeam;
$("showTeam").addEventListener("change",e=>{showTeam=e.target.checked;try{localStorage.setItem("showTeam",showTeam?"1":"0")}catch(_){};render(true)});

let lastMinute=-1;
function render(force){
  const now=new Date(), j=jst(now);
  $("clock").textContent=`${j.getUTCMonth()+1}/${j.getUTCDate()} ${pad(j.getUTCHours())}:${pad(j.getUTCMinutes())}:${pad(j.getUTCSeconds())} JST`;

  const left=DEADLINE-now;
  const big=$("big");
  big.innerHTML=bigHTML(left);
  big.classList.toggle("urgent",left>0&&left<3*3600e3);
  const s=Math.max(0,Math.floor(left/1000)%60);
  $("heroSub").textContent=left>0?`${pad(s)}秒 ・ 合計 ${Math.floor(left/60000).toLocaleString()} 分`:"お疲れさまでした。発表・審査へ。";
  const p=Math.min(1,Math.max(0,(now-START)/(DEADLINE-START)));
  $("barFill").style.width=(p*100).toFixed(1)+"%";
  $("pct").textContent=`経過 ${Math.round(p*100)}%`;

  const vis=EVENTS.filter(e=>showTeam||e.kind!=="team");
  const nxt=vis.find(e=>e.at>now);
  if(nxt){$("nextV").textContent=dur(nxt.at-now,true);$("nextN").textContent=nxt.name;$("nextT").textContent=`${jst(nxt.at).getUTCMonth()+1}/${jst(nxt.at).getUTCDate()} ${hm(nxt.at)}`}
  else{$("nextV").textContent="—";$("nextN").textContent="すべての予定が終了しました";$("nextT").textContent=""}
  $("goalV").textContent=dur(GOAL-now,true);

  const minute=Math.floor(now/60000);
  if(!force&&minute===lastMinute) return;
  lastMinute=minute;
  let html="",curDay=null,nowDrawn=false;
  for(const e of vis){
    const d=jst(e.at).getUTCDate();
    if(d!==curDay){if(curDay!==null)html+="</ol>";html+=`<div class="day">11/${d}（${d===14?"土":"日"}）</div><ol>`;curDay=d}
    if(!nowDrawn&&e.at>now){
      if(e!==vis[0]) html+=`</ol><div class="now-line"><span>${hm(now)}</span><span></span><span>いまここ</span></div><ol>`;
      nowDrawn=true;
    }
    const past=e.at<=now, isNext=e===nxt;
    const cls=[e.kind,past?"past":"",isNext?"next-up":""].join(" ");
    const tag=e.kind==="team"?'<span class="tag team">チーム</span>':e.kind==="key"?'<span class="tag key">実質締切</span>':"";
    html+=`<li class="${cls}"><span class="time">${hm(e.at)}</span><span class="dot"></span><span class="name">${e.name}${tag}</span><span class="rem">${past?"済":"あと "+dur(e.at-now,true)}</span></li>`;
  }
  html+="</ol>";
  $("tl").innerHTML=html;
}
render(true);
setInterval(render,1000);
</script>
</body></html>
